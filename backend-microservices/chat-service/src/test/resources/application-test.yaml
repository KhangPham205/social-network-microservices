spring:
  datasource:
    url: jdbc:h2:mem:chat;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  data:
    mongodb:
      uri: mongodb://localhost:27017/chat_test
    redis:
      host: localhost
      port: 6379
  cache:
    type: simple
  kafka:
    bootstrap-servers: localhost:1
    listener:
      auto-startup: false
  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false

jwt:
  secret: test-only-jwt-secret-0123456789abcdef0123456789abcdef

app:
  internal:
    token: test-internal-token
  cors:
    allowed-origins: http://localhost:3000
