server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/social_network # Đảm bảo bạn đã tạo DB này trong Postgres
    username: root     # Thay bằng user Postgres của bạn
    password: password # Thay bằng pass Postgres của bạn
  jpa:
    hibernate:
      ddl-auto: update # Tự động tạo bảng dựa trên Entity
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# Cấu hình tự tạo cho JWT
