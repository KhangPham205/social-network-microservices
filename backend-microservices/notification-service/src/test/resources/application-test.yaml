spring:
  datasource:
    url: jdbc:h2:mem:notification;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  kafka:
    bootstrap-servers: localhost:1
    listener:
      auto-startup: false
  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false

jwt:
  secret: test-only-jwt-secret-0123456789abcdef0123456789abcdef

app:
  internal:
    token: test-internal-token
  cors:
    allowed-origins: http://localhost:3000
