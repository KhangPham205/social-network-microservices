server:
  port: 8080
  tomcat:
    threads:
      max: 600 # Tăng số luồng xử lý đồng thời lên 600 (mặc định 200)
      accept-count: 200 # Tăng hàng đợi

spring:
  application:
    name: api-gateway
  datasource:
    hikari:
      maximum-pool-size: 50 # Tăng số lượng kết nối DB đồng thời (mặc định 10)
      minimum-idle: 10

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# --- CẤU HÌNH GỘP SWAGGER ---
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Auth Service
        url: /aggregate/auth-service/v3/api-docs
      - name: User Service
        url: /aggregate/user-service/v3/api-docs
      - name: Media Service
        url: /aggregate/media-service/v3/api-docs
      - name: Notification Service
        url: /aggregate/notification-service/v3/api-docs
      - name: Chat Service
        url: /aggregate/chat-service/v3/api-docs
      - name: Moderation Service
        url: /aggregate/moderation-service/v3/api-docs

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.web.reactive: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG