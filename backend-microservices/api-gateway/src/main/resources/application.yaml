server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 15s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: false
    fetch-registry: true
  instance:
    prefer-ip-address: true

app:
  cors:
    # Comma separated list of exact origins allowed to call the API with credentials.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

# Aggregated Swagger UI: every entry is served through the /aggregate/<service>/v3/api-docs route.
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Auth Service
        url: /aggregate/auth-service/v3/api-docs
      - name: User Service
        url: /aggregate/user-service/v3/api-docs
      - name: Media Service
        url: /aggregate/media-service/v3/api-docs
      - name: Notification Service
        url: /aggregate/notification-service/v3/api-docs
      - name: Chat Service
        url: /aggregate/chat-service/v3/api-docs
      - name: Moderation Service
        url: /aggregate/moderation-service/v3/api-docs

logging:
  level:
    root: INFO
    # Uncomment while debugging routing/load-balancing decisions:
    # org.springframework.cloud.gateway: DEBUG
    # org.springframework.cloud.loadbalancer: DEBUG
