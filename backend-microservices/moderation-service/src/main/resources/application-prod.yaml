spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}

ai-service:
  url: ${AI_SERVICE_URL}

jwt:
  secret: ${JWT_SECRET}

app:
  internal:
    token: ${INTERNAL_API_TOKEN}
