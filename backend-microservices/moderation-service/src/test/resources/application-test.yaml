spring:
  # rsql-jpa 6.0.33 probes Hibernate dialects with a chain of instanceof checks that still
  # references the removed DerbyDialect; on H2 that chain is walked and fails. PostgreSQL matches
  # the first check, so production is unaffected and only the test context needs the exclusion.
  autoconfigure:
    exclude: io.github.perplexhub.rsql.RSQLJPAAutoConfiguration

  datasource:
    url: jdbc:h2:mem:moderation;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  kafka:
    bootstrap-servers: localhost:1
    listener:
      auto-startup: false
  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false

ai-service:
  url: http://localhost:8000

jwt:
  secret: test-only-jwt-secret-0123456789abcdef0123456789

app:
  internal:
    token: test-internal-token
