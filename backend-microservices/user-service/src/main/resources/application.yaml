server:
  port: 8082

spring:
  application:
    name: user-service
  profiles:
    active: dev
  servlet:
    multipart:
      enabled: true
  swagger-ui:
    path: /swagger-ui.html
    server:
      # Trỏ về domain/IP của Gateway thay vì localhost:8082
      url: http://localhost:8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

